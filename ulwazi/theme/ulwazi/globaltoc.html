{# Sphinx sidebar template: global table of contents. #}
{% include "searchbox.html" %}
{{ expandable_navigation_tree }}

{% if help_links %}
<nav class="p-side-navigation p-help-nav-group p-help-nav-group--divided" aria-label="{{ help_links.title }}">
    <ul class="p-side-navigation__list">
        <li class="p-side-navigation__item has-children">
            <div class="nav-item" data-checkbox="help-links-toggle-primary">
                <a class="p-side-navigation__link js-toggle-only-link" href="#"><i class="p-icon--help"></i> {{ help_links.title }}</a>
                <input type="checkbox" class="toctree-checkbox" id="help-links-toggle-primary" name="help-links-toggle-primary" role="switch">
                <label for="help-links-toggle-primary">
                    <span><i class="p-icon--chevron-down"></i><i class="p-icon--chevron-up"></i></span>
                </label>
            </div>
            <ul class="p-side-navigation__list">
                {% for link in help_links.links %}
                <li class="p-side-navigation__item hidden">
                    <div class="nav-item">
                        <a class="p-side-navigation__link" href="{{ link.url }}">{{ link.text }}</a>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </li>
    </ul>
</nav>
{% endif %}
